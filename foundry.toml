# Foundry here is a TEST HARNESS only: the contract itself is Core Solidity
# (core/*.sol, compiled by scripts/check-core.sh). The tests under test/ deploy
# that compiled bytecode and drive it, so there is no Solidity `src` tree.
[profile.default]
src = "test"
out = "out"
libs = ["lib"]
solc = "0.8.33"
fs_permissions = [{ access = "read", path = "./core/build" }]

# The invariant suites advertise a 128k-call scale (256 runs x 500 calls per
# invariant). These are the current foundry defaults; pin them so the scale is
# a property of the repo, not of whichever forge version is installed.
[invariant]
runs = 256
depth = 500
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
